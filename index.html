<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="app">
        <h1>To-Do</h1>

        <form id="todo-form">
            <input id="todo-input" type="text" placeholder="What needs doing?" autocomplete="off" required>
            <button type="submit">Add</button>
        </form>

        <ul id="todo-list"></ul>

        <p id="todo-count"></p>
    </main>

    <script src="script.js"></script>
</body>

</html>
